<div class="login-container">
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">P</div>
      <div class="logo-title">PISA</div>
      <div class="logo-subtitle">Programa para la Evaluación Internacional de Alumnos</div>
    </div>

    <div class="login-form">
      <h2>Iniciar Sesión</h2>
      <p class="welcome-text">Ingresa tus credenciales para acceder al examen</p>

      @if (errorMessage()) {
        <div class="error-message">
          <span>⚠️ {{ errorMessage() }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            placeholder="estudiante@ejemplo.com"
            required
            [disabled]="isLoading()"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="••••••••"
            required
            [disabled]="isLoading()"
          />
        </div>

        <button type="submit" class="btn-login" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner"></span>
            <span>Iniciando sesión...</span>
          } @else {
            <span>Iniciar Sesión</span>
          }
        </button>
      </form>

      <div class="login-footer">
        <p>Credenciales de prueba:</p>
        <p><strong>Email:</strong> estudiante@ejemplo.com</p>
        <p><strong>Contraseña:</strong> 123456</p>
      </div>
    </div>
  </div>

  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
</div>
